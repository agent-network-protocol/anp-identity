[workspace]
members = ["bindings/node", "crates/anp-did"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/agent-network-protocol/anp-did"

[workspace.dependencies]
anp = { path = "../anp/rust", default-features = false }
base64 = "0.22"
bs58 = "0.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
fs2 = "0.4"
hkdf = "0.12"
keyring = "4.1.6"
napi = { version = "3.12.1", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3.6.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
