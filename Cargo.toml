[workspace]
members = ["crates/anp-did"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/agent-network-protocol/anp-did"

[workspace.dependencies]
anp = { path = "../anp/rust", default-features = false }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
hkdf = "0.12"
keyring = "4.1.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
