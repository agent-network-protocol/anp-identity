[workspace]
members = ["crates/anp-did"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/agent-network-protocol/anp-did"

[workspace.dependencies]
anp = { path = "../anp/rust", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
