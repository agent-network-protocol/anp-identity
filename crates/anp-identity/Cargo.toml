[package]
name = "anp-identity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/agent-network-protocol/anp-identity"
documentation = "https://docs.rs/anp-identity"
description = "Secure E1 DID identity custody and lifecycle management for ANP"
readme = "../../README.md"
keywords = ["anp", "did", "identity", "did-wba"]
categories = ["authentication", "cryptography"]

[features]
default = []
key-import = []
root-export = []

[dependencies]
anp.workspace = true
base64.workspace = true
bs58.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
hkdf.workspace = true
hmac.workspace = true
keyring.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true
x25519-dalek.workspace = true

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
trybuild = "1"

[[bench]]
name = "hot_paths"
harness = false
