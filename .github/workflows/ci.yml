name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: anp-identity
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          path: anp
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install public API checker
        run: cargo install cargo-public-api --locked --version 0.52.0
      - name: Format
        working-directory: anp-identity
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: anp-identity
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: anp-identity
        run: cargo test --workspace --all-features
      - name: Public API baseline
        working-directory: anp-identity
        run: ./scripts/check-public-api.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node binding
        working-directory: anp-identity
        run: npm --prefix bindings/node ci --omit=optional && npm --prefix bindings/node run build && npm --prefix bindings/node test

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: anp-identity
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          path: anp
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build native development dependency
        working-directory: anp-identity
        run: npm --prefix bindings/node ci --omit=optional && npm --prefix bindings/node run build:debug
      - name: Verify DSH package
        working-directory: anp-identity/packages/dsh-anp-identity
        run: |
          npm ci --legacy-peer-deps
          npm run verify
          npm pack --dry-run
