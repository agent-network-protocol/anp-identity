name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: anp-identity
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          ref: 1.0.3
          path: anp
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install public API checker
        run: cargo install cargo-public-api --locked --version 0.52.0
      - name: Format
        working-directory: anp-identity
        run: cargo fmt --package anp-identity --package anp-identity-node -- --check
      - name: Clippy
        working-directory: anp-identity
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: anp-identity
        run: cargo test --workspace --all-features
      - name: Public API baseline
        working-directory: anp-identity
        run: ./scripts/check-public-api.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node binding
        working-directory: anp-identity
        run: npm --prefix bindings/node ci --omit=optional && npm --prefix bindings/node run build && npm --prefix bindings/node test

  dsh-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: anp-identity
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          ref: 1.0.3
          path: anp
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build native development dependency
        working-directory: anp-identity
        run: npm --prefix bindings/node ci --omit=optional && npm --prefix bindings/node run build:debug
      - name: Verify DSH package
        working-directory: anp-identity/packages/dsh-anp-identity
        run: |
          npm ci --legacy-peer-deps
          npm run verify
          npm pack --dry-run
      - name: Signed HTTP demo
        working-directory: anp-identity/demo/dsh-http
        run: |
          node build.mjs
          node setup.mjs
          node server/index.mjs &
          verifier_pid=$!
          trap 'kill "$verifier_pid" 2>/dev/null || true' EXIT
          NODE_EXTRA_CA_CERTS="$PWD/runtime/tls/ca.crt" node --input-type=module -e '
            for (let attempt = 0; ; attempt++) {
              try { const response = await fetch("https://127.0.0.1:19443/health"); if (response.ok) break; } catch {}
              if (attempt >= 49) throw new Error("Demo server did not become ready");
              await new Promise(resolve => setTimeout(resolve, 100));
            }'
          node --test test/*.test.mjs
